name: Comic checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-images.txt
      - run: python -m unittest discover -s tests -v
      - name: Reproduce original Git fixture, log, comics and ledger replay
        run: python tools/reproduce.py --out work/ci-demo --locale en --images
      - uses: actions/upload-artifact@v4
        with:
          name: comic-demo-${{ matrix.os }}
          path: |
            work/ci-demo/en
            work/ci-demo/verification.json
